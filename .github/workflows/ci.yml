name: Embedded CI

on:
  push:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name under Projects/"
        required: true
        default: "020_Bouncy_Ball"
      build:
        description: "Build type"
        required: true
        default: "debug"
      test:
        description: "Test mode"
        required: true
        default: "none"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker compose -f container/docker-compose.yml build

      - name: Run project build
        run: |
          PROJECT="${{ inputs.project || '020_Bouncy_Ball' }}"
          BUILD="${{ inputs.build || 'debug' }}"
          TEST="${{ inputs.test || 'none' }}"

          docker compose -f container/docker-compose.yml run --rm embedded-dev \
            bash -lc "cd /workspace/Projects/${PROJECT} && make target=target test=${TEST} build=${BUILD}"
