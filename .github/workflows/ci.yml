name: Embedded CI

on:
  push:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name under Projects/"
        required: true
        default: "020_Bouncy_Ball"
      build:
        description: "Build type"
        required: true
        default: "debug"
      test:
        description: "Test mode"
        required: true
        default: "none"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PROJECT: ${{ github.event.inputs.project || '020_Bouncy_Ball' }}
      BUILD: ${{ github.event.inputs.build || 'debug' }}
      TEST: ${{ github.event.inputs.test || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          tags: embedded-ci:latest
          load: true
          cache-from: type=gha,scope=embedded-ci
          cache-to: type=gha,mode=max,scope=embedded-ci

      - name: Run project build
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w "/workspace/Projects/${PROJECT}" \
            embedded-ci:latest \
            bash -lc "make target=target test=${TEST} build=${BUILD}"
