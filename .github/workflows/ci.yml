name: Embedded CI

on:
  push:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name under Projects/"
        required: true
        default: "020_Bouncy_Ball"
      build:
        description: "Build type"
        required: true
        default: "debug"
      test:
        description: "Test mode"
        required: true
        default: "none"

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository }}/embedded-ci" \
            | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=embedded-ci
          cache-to: type=gha,mode=max,scope=embedded-ci

  build:
    runs-on: ubuntu-latest
    needs: docker-image
    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs/defaults
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PROJECT=${{ github.event.inputs.project }}" >> "$GITHUB_ENV"
            echo "BUILD=${{ github.event.inputs.build }}" >> "$GITHUB_ENV"
            echo "TEST=${{ github.event.inputs.test }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT=020_Bouncy_Ball" >> "$GITHUB_ENV"
            echo "BUILD=debug" >> "$GITHUB_ENV"
            echo "TEST=none" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "$IMAGE"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('Projects/**/*.c', 'Projects/**/*.cpp', 'Projects/**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Build project
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            -w "/workspace/Projects/${PROJECT}" \
            "$IMAGE" \
            bash -lc "make target=target test=${TEST} build=${BUILD}"

      - name: Show ccache stats
        if: always()
        run: |
          docker run --rm \
            -v "${HOME}/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            "$IMAGE" \
            bash -lc "ccache -s || true"
