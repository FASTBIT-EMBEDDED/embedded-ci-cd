name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck ninja-build

      - name: Configure
        run: |
          cmake -S . -B build/Debug -G Ninja

      - name: Build
        run: |
          python tools/quality/run_build.py

      - name: Format check
        run: |
          python tools/quality/format_check.py

      - name: Run cppcheck
        run: |
          python tools/quality/run_cppcheck.py

      - name: Run clang-tidy
        run: |
          python tools/quality/run_clang_tidy.py
