name: Embedded CI

on:
  push:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name under Projects/"
        required: true
        default: "020_Bouncy_Ball"
      build:
        description: "Build type"
        required: true
        default: "debug"
      test:
        description: "Test mode"
        required: true
        default: "none"

jobs:
  docker-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository }}/embedded-ci" \
            | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  build:
    runs-on: ubuntu-latest
    needs: docker-image
    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}:latest
      PROJECT: ${{ github.event.inputs.project || '020_Bouncy_Ball' }}
      BUILD: ${{ github.event.inputs.build   || 'debug' }}
      TEST: ${{ github.event.inputs.test    || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull ${{ env.IMAGE }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.PROJECT }}-${{ env.BUILD }}-${{ hashFiles('Projects/**/*.c', 'Projects/**/*.cpp', 'Projects/**/*.h') }}
          restore-keys: |
            ccache-${{ env.PROJECT }}-${{ env.BUILD }}-
            ccache-${{ env.PROJECT }}-

      - name: Build project
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            -w "/workspace/Projects/${PROJECT}" \
            ${{ env.IMAGE }} \
            bash -lc "ccache make target=target build=${BUILD}"

      - name: Run tests
        if: env.TEST != 'none'
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w "/workspace/Projects/${PROJECT}" \
            ${{ env.IMAGE }} \
            bash -lc "make target=target test=${TEST} build=${BUILD}"
