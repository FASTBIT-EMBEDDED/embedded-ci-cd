name: Embedded CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "Projects/**"
      - "container/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder"
        required: true
        default: "020_Bouncy_Ball"
      build:
        description: "debug or release"
        required: true
        default: "debug"
      test:
        description: "all | gtest | qutest | none"
        required: true
        default: "none"

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image name
        id: img
        run: |
          echo "name=ghcr.io/${{ github.repository }}/embedded-ci" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha,scope=embedded-ci
          cache-to: type=gha,mode=max,scope=embedded-ci

  build:
    runs-on: ubuntu-latest
    needs: docker-image
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}:latest

    steps:
      - uses: actions/checkout@v5

      - name: Resolve inputs/defaults
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PROJECT=${{ github.event.inputs.project }}" >> "$GITHUB_ENV"
            echo "BUILD=${{ github.event.inputs.build }}" >> "$GITHUB_ENV"
            echo "TEST=${{ github.event.inputs.test }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT=020_Bouncy_Ball" >> "$GITHUB_ENV"
            echo "BUILD=debug" >> "$GITHUB_ENV"
            echo "TEST=none" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "$IMAGE"

      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ env.PROJECT }}-${{ env.BUILD }}-${{ hashFiles('Projects/**/*.c', 'Projects/**/*.h', 'Projects/**/*.cpp') }}
          restore-keys: |
            ccache-${{ env.PROJECT }}-${{ env.BUILD }}-
            ccache-${{ env.PROJECT }}-

      - name: Build + analyze + test
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            -w "/workspace/Projects/${PROJECT}" \
            "$IMAGE" \
            bash -lc "make target=target test=${TEST} build=${BUILD}"

      - name: Show ccache stats
        if: always()
        run: |
          docker run --rm \
            -v "${HOME}/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            "$IMAGE" \
            bash -lc "ccache -s || true"
